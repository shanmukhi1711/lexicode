{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>New Plagiarism Check</h2>
    <div class="tabs">
        <button class="tab-link active" onclick="openTab(event, 'Paste')">Paste Text</button>
        <button class="tab-link" onclick="openTab(event, 'Upload')">Upload File</button>
    </div>

    <form method="POST" action="{{ url_for('main.check') }}" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="form-group">
            <label>Document Title (optional)</label>
            <input type="text" name="title" placeholder="e.g., Final Essay">
        </div>

        <div id="Paste" class="tab-content" style="display: block;">
            <div class="form-group">
                <label>Paste your text here (50 - 50,000 words)</label>
                <textarea name="text" rows="10" style="width: 100%;" id="text-input" oninput="updateWordCount()"></textarea>
                <small id="word-count">Words: 0</small>
            </div>
        </div>

        <div id="Upload" class="tab-content" style="display: none;">
            <div class="form-group">
                <label>Upload Document (.txt, .docx, .pdf, .c, .py - max 5MB) <br><small><i>Hold Ctrl (Windows) or Cmd (Mac) to select multiple files</i></small></label>
                <input type="file" name="file" accept=".txt,.docx,.pdf,.c,.py" multiple>
            </div>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" name="ignore_quotes" value="yes"> Ignore quoted text and bibliography
            </label>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Check Plagiarism</button>
    </form>
</div>

<script>
function openTab(evt, tabName) {
    var i, tabcontent, tablinks;
    tabcontent = document.getElementsByClassName("tab-content");
    for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
    }
    tablinks = document.getElementsByClassName("tab-link");
    for (i = 0; i < tablinks.length; i++) {
        tablinks[i].className = tablinks[i].className.replace(" active", "");
    }
    document.getElementById(tabName).style.display = "block";
    evt.currentTarget.className += " active";
}

function updateWordCount() {
    var text = document.getElementById("text-input").value;
    var words = text.match(/\b[-?(\w+)?]+\b/gi);
    var count = words ? words.length : 0;
    document.getElementById("word-count").innerText = "Words: " + count;
    
    var btn = document.getElementById("submit-btn");
    if (count > 0 && (count < 50 || count > 50000)) {
        document.getElementById("word-count").style.color = "red";
        btn.disabled = true;
    } else {
        document.getElementById("word-count").style.color = "inherit";
        btn.disabled = false;
    }
}
</script>

<style>
.tabs { margin-bottom: 1rem; border-bottom: 1px solid #ccc; }
.tab-link { background: none; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; }
.tab-link.active { border-bottom: 2px solid #0b3d91; font-weight: bold; color: #0b3d91; }
.tab-content { margin-top: 1rem; }
.card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
textarea { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
</style>
{% endblock %}
